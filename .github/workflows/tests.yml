name: tests

on:
  push:
    branches:
      - main
    paths:
      - '**.js'
      - 'package.json'
      - 'package-lock.json'
      - 'messages.json'
      - 'public/**'
      - 'test/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.js'
      - 'package.json'
      - 'package-lock.json'
      - 'messages.json'
      - 'public/**'
      - 'test/**'
      - '.github/workflows/tests.yml'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Tests
        run: npm test
